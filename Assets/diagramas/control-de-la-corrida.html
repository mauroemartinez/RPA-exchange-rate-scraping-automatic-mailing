<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily macro report · Run control</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Argentinian macro report</p>
    <h1>Why a second order never mails the list twice</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="control-title control-desc">
        <title id="control-title">Why a second order never mails the list twice</title>
        <desc id="control-desc">Flowchart of the control stage: a run takes the database lock, skips weekends and holidays, skips a day whose row and mail already exist, raises an alert for a day left half done, and otherwise runs the report.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Arrows first -->
        <line x1="480" y1="80" x2="480" y2="108" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="480" y1="164" x2="480" y2="196" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <line x1="480" y1="252" x2="480" y2="284" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <line x1="480" y1="340" x2="480" y2="380" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <line x1="480" y1="428" x2="480" y2="476" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <line x1="536" y1="136" x2="632" y2="136" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 536,224 H 688 Q 696,224 696,216 V 156" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="536" y1="312" x2="664" y2="312" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="720" y1="284" x2="720" y2="156" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="720" y1="340" x2="720" y2="384" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Branch labels -->
        <rect x="488" y="174" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="504" y="183" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>
        <rect x="488" y="262" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="504" y="271" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>
        <rect x="488" y="354" width="24" height="12" rx="2" fill="#f5f5f5"/>
        <text x="500" y="363" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>
        <rect x="568" y="116" width="28" height="12" rx="2" fill="#f5f5f5"/>
        <text x="582" y="125" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>
        <rect x="592" y="204" width="28" height="12" rx="2" fill="#f5f5f5"/>
        <text x="606" y="213" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>
        <rect x="584" y="292" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="600" y="301" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>
        <rect x="728" y="212" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="744" y="221" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>
        <rect x="728" y="356" width="24" height="12" rx="2" fill="#f5f5f5"/>
        <text x="740" y="365" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>

        <!-- Start -->
        <rect x="392" y="40" width="176" height="40" rx="20" fill="#f5f5f5"/>
        <rect x="392" y="40" width="176" height="40" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="480" y="64" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">An order arrives</text>

        <!-- Decision 1: lock -->
        <polygon points="480,108 536,136 480,164 424,136" fill="#f5f5f5"/>
        <polygon points="480,108 536,136 480,164 424,136" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="480" y="140" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Lock free?</text>

        <!-- Decision 2: calendar -->
        <polygon points="480,196 536,224 480,252 424,224" fill="#f5f5f5"/>
        <polygon points="480,196 536,224 480,252 424,224" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="480" y="228" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Business day?</text>

        <!-- Decision 3: row -->
        <polygon points="480,284 536,312 480,340 424,312" fill="#f5f5f5"/>
        <polygon points="480,284 536,312 480,340 424,312" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="480" y="316" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Row exists?</text>

        <!-- Decision 4: finished -->
        <polygon points="720,284 776,312 720,340 664,312" fill="#f5f5f5"/>
        <polygon points="720,284 776,312 720,340 664,312" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="720" y="316" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Mail sent?</text>

        <!-- Run (focal) -->
        <rect x="392" y="380" width="176" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="392" y="380" width="176" height="48" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="480" y="400" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Run the report</text>
        <text x="480" y="416" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">scrape · store · mail · deck</text>

        <!-- End: done -->
        <rect x="392" y="476" width="176" height="40" rx="20" fill="#f5f5f5"/>
        <rect x="392" y="476" width="176" height="40" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="480" y="500" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Report delivered</text>

        <!-- End: omitida -->
        <rect x="632" y="116" width="176" height="40" rx="20" fill="#f5f5f5"/>
        <rect x="632" y="116" width="176" height="40" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="720" y="140" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ends as omitida</text>

        <!-- End: error -->
        <rect x="632" y="384" width="176" height="40" rx="20" fill="#f5f5f5"/>
        <rect x="632" y="384" width="176" height="40" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="720" y="408" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Error + alert mail</text>

        <!-- Legend strip -->
        <line x1="40" y1="548" x2="920" y2="548" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="564" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <line x1="40" y1="581" x2="68" y2="581" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="76" y="584" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Happy path, once a day</text>

        <line x1="220" y1="581" x2="248" y2="581" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="256" y="584" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Every other order: retries, duplicates, holidays</text>

        <text x="540" y="584" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">"Mail sent?" reads the stored AI text: a row without it means the previous run died halfway.</text>
      </svg>
    </div>
  </div>
</body>
</html>
