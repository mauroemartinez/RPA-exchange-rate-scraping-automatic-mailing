<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily macro report · Sequence</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · Argentinian macro report</p>
    <h1>What happens at 16:00</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="secuencia-title secuencia-desc">
        <title id="secuencia-title">What happens at 16:00</title>
        <desc id="secuencia-desc">Sequence diagram of one daily run: the Cloudflare cron dispatches GitHub Actions, which scrapes the sources, inserts the row in Supabase, asks Gemini for the texts, mails the subscribers, pushes the charts, and answers a later retry with an omitted run.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Lifelines -->
        <line x1="104" y1="104" x2="104" y2="528" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="296" y1="104" x2="296" y2="528" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="488" y1="104" x2="488" y2="528" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="680" y1="104" x2="680" y2="528" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="856" y1="104" x2="856" y2="528" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

        <!-- Combined fragment: the 17:07 retry (frame before the messages inside it) -->
        <rect x="56" y="432" width="296" height="84" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <rect x="56" y="432" width="40" height="16" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="76" y="444" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">OPT</text>
        <text x="68" y="462" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[retry, row exists]</text>

        <!-- Activation bars -->
        <rect x="292" y="136" width="8" height="288" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="484" y="216" width="8" height="16" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="484" y="320" width="8" height="16" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="676" y="256" width="8" height="32" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="852" y="360" width="8" height="16" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="292" y="476" width="8" height="28" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

        <!-- Messages (time flows down) -->
        <line x1="104" y1="136" x2="292" y2="136" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <path d="M 300,160 H 340 V 184 H 302" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="300" y1="216" x2="484" y2="216" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="300" y1="256" x2="676" y2="256" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <line x1="676" y1="288" x2="300" y2="288" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <line x1="300" y1="320" x2="484" y2="320" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="300" y1="360" x2="852" y2="360" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <path d="M 300,392 H 340 V 416 H 302" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="104" y1="476" x2="292" y2="476" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <line x1="292" y1="504" x2="104" y2="504" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

        <!-- Message labels (mask 8px clear of the stroke) -->
        <rect x="170" y="116" width="60" height="12" rx="2" fill="#f5f5f5"/>
        <text x="200" y="125" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DISPATCH</text>

        <rect x="348" y="166" width="100" height="12" rx="2" fill="#f5f5f5"/>
        <text x="352" y="175" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">SCRAPE 6 SITES</text>

        <rect x="356" y="196" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="392" y="205" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">INSERT ROW</text>

        <rect x="556" y="236" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="584" y="245" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PROMPT</text>

        <rect x="556" y="268" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="584" y="277" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">JSON</text>

        <rect x="360" y="300" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="392" y="309" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">AI TEXTS</text>

        <rect x="728" y="340" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="768" y="349" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SEND 2 MAILS</text>

        <rect x="348" y="398" width="96" height="12" rx="2" fill="#f5f5f5"/>
        <text x="352" y="407" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">PUSH PREVIEWS</text>

        <rect x="176" y="456" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="200" y="465" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RETRY</text>

        <rect x="172" y="484" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="200" y="493" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">OMITIDA</text>

        <!-- Actors -->
        <rect x="40" y="56" width="128" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="56" width="128" height="48" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="104" y="78" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cloudflare Worker</text>
        <text x="104" y="94" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cron · UTC-3</text>

        <rect x="232" y="56" width="128" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="232" y="56" width="128" height="48" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="296" y="78" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">GitHub Actions</text>
        <text x="296" y="94" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">pipeline.py</text>

        <rect x="424" y="56" width="128" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="424" y="56" width="128" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="488" y="78" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Supabase</text>
        <text x="488" y="94" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Postgres</text>

        <rect x="616" y="56" width="128" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="616" y="56" width="128" height="48" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="680" y="78" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Gemini</text>
        <text x="680" y="94" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">structured output</text>

        <rect x="792" y="56" width="128" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="792" y="56" width="128" height="48" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="856" y="78" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Gmail</text>
        <text x="856" y="94" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">SMTP</text>

        <!-- Legend strip -->
        <line x1="40" y1="544" x2="920" y2="544" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="560" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <line x1="40" y1="581" x2="68" y2="581" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="76" y="584" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">HTTP call</text>

        <line x1="160" y1="581" x2="188" y2="581" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="196" y="584" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Internal step</text>

        <line x1="300" y1="581" x2="328" y2="581" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="336" y="584" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Return</text>

        <line x1="420" y1="581" x2="448" y2="581" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="456" y="584" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">The deliverable</text>

        <rect x="560" y="576" width="14" height="10" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="580" y="584" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Optional: a retry on a finished day ends as omitida, nothing is sent</text>
      </svg>
    </div>
  </div>
</body>
</html>
