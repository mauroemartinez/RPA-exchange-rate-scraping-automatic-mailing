<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily macro report · Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Argentinian macro report</p>
    <h1>One business day, end to end</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="arquitectura-title arquitectura-desc">
        <title id="arquitectura-title">One business day, end to end</title>
        <desc id="arquitectura-desc">Architecture diagram showing a Cloudflare cron dispatching a GitHub Actions run that scrapes six Argentine sources, stores the row in Supabase, asks Gemini for the narrative and delivers the report by Gmail and to the GitHub repository.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zone: the GitHub Actions runner (drawn before arrows and nodes) -->
        <rect x="304" y="128" width="400" height="200" rx="8"
              fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="312" y="132" width="212" height="12" rx="2" fill="#f5f5f5"/>
        <text x="418" y="141" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.14em">GITHUB ACTIONS · UBUNTU · PYTHON PIPELINE.PY</text>

        <!-- Arrows first (behind boxes) -->
        <!-- Cloudflare -> Ingest: the daily order -->
        <line x1="184" y1="192" x2="336" y2="192" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <!-- Ingest -> Sources: scraping and API calls -->
        <path d="M 368,240 V 328 Q 368,336 360,336 H 184" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <!-- Ingest -> Report: today's validated row -->
        <line x1="480" y1="208" x2="528" y2="208" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Ingest -> Supabase: idempotent upsert -->
        <line x1="400" y1="240" x2="400" y2="368" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Supabase -> Report: full history -->
        <path d="M 480,392 H 592 Q 600,392 600,384 V 240" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Report -> Gemini: structured prompt, and the dashed JSON return -->
        <line x1="592" y1="176" x2="592" y2="104" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <line x1="608" y1="104" x2="608" y2="176" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <!-- Report -> Gmail: the headline delivery -->
        <line x1="672" y1="208" x2="760" y2="208" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <!-- Report -> Repository: charts and deck -->
        <path d="M 640,240 V 408 Q 640,416 648,416 H 760" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Arrow labels (opaque mask, 8px clear of the stroke) -->
        <rect x="224" y="172" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="260" y="181" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DISPATCH</text>

        <rect x="312" y="276" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="336" y="285" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HTTPS</text>

        <rect x="408" y="296" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="432" y="305" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">UPSERT</text>

        <rect x="500" y="372" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="528" y="381" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HISTORY</text>

        <rect x="532" y="128" width="52" height="12" rx="2" fill="#f5f5f5"/>
        <text x="558" y="137" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PROMPT</text>

        <rect x="616" y="128" width="36" height="12" rx="2" fill="#f5f5f5"/>
        <text x="634" y="137" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">JSON</text>

        <rect x="696" y="188" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="716" y="197" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SMTP</text>

        <rect x="648" y="300" width="36" height="12" rx="2" fill="#f5f5f5"/>
        <text x="666" y="309" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PUSH</text>

        <!-- Node: Cloudflare Worker (external) -->
        <rect x="40" y="176" width="144" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="176" width="144" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="48" y="184" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
        <text x="64" y="193" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CRON</text>
        <text x="112" y="212" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cloudflare Worker</text>
        <text x="112" y="228" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">16:00 ART · Mon to Fri</text>

        <!-- Node: Sources (input) -->
        <rect x="40" y="304" width="144" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="304" width="144" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <rect x="48" y="312" width="28" height="12" rx="2" fill="transparent" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
        <text x="62" y="321" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WEB</text>
        <text x="112" y="340" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Market sources</text>
        <text x="112" y="356" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">BNA · BCRA · FED · Yahoo</text>

        <!-- Node: Ingest (backend) -->
        <rect x="336" y="176" width="144" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="336" y="176" width="144" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="344" y="184" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="358" y="193" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ETL</text>
        <text x="408" y="212" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ingest and validate</text>
        <text x="408" y="228" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Playwright · httpx</text>

        <!-- Node: Report (focal) -->
        <rect x="528" y="176" width="144" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="528" y="176" width="144" height="64" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="536" y="184" width="28" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
        <text x="550" y="193" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OUT</text>
        <text x="600" y="212" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Build the report</text>
        <text x="600" y="228" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">charts · mail · deck</text>

        <!-- Node: Gemini (external) -->
        <rect x="528" y="40" width="144" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="528" y="40" width="144" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="536" y="48" width="24" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
        <text x="548" y="57" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AI</text>
        <text x="600" y="76" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Gemini</text>
        <text x="600" y="92" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">summary + chart notes</text>

        <!-- Node: Supabase (store) -->
        <rect x="336" y="368" width="144" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="336" y="368" width="144" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="344" y="376" width="24" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
        <text x="356" y="385" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
        <text x="408" y="404" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Supabase Postgres</text>
        <text x="408" y="420" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">daily row · 14 series</text>

        <!-- Node: Gmail (external) -->
        <rect x="760" y="176" width="144" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="760" y="176" width="144" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="768" y="184" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
        <text x="784" y="193" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MAIL</text>
        <text x="832" y="212" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Subscribers</text>
        <text x="832" y="228" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Gmail · two variants</text>

        <!-- Node: Repository (store) -->
        <rect x="760" y="384" width="144" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="760" y="384" width="144" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="768" y="392" width="24" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
        <text x="780" y="401" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GIT</text>
        <text x="832" y="420" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">GitHub repository</text>
        <text x="832" y="436" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Previews/ · deck branch</text>

        <!-- Legend strip -->
        <line x1="40" y1="536" x2="920" y2="536" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="552" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="568" width="14" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="60" y="576" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal step</text>

        <rect x="160" y="568" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="180" y="576" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Pipeline stage</text>

        <rect x="300" y="568" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="320" y="576" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Store</text>

        <rect x="400" y="568" width="14" height="10" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="420" y="576" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">External service</text>

        <rect x="540" y="568" width="14" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="560" y="576" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Input</text>

        <line x1="640" y1="573" x2="668" y2="573" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="676" y="576" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">HTTP call</text>

        <line x1="760" y1="573" x2="788" y2="573" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="796" y="576" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Delivery</text>

        <line x1="860" y1="573" x2="888" y2="573" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <text x="896" y="576" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Return</text>
      </svg>
    </div>
  </div>
</body>
</html>
