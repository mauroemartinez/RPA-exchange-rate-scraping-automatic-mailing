# La corrida diaria del reporte en GitHub Actions (fase 6 del roadmap).
#
# APAGADA POR DEFECTO: solo se dispara a mano, desde Actions > Corrida diaria >
# Run workflow, y por defecto en dry-run (no escribe ni manda nada). Para
# programarla, seguí docs/programacion-y-monitoreo.md y descomentá el bloque
# `schedule`. No la programes si la corrida también se dispara desde otro lado
# (EasyPanel, el notebook): el candado en Supabase evita dos corridas a la vez,
# pero el notebook no lo respeta.
#
# El repo es público, así que el log de cada corrida también lo es. GitHub tapa
# los secretos completos y pipeline.py tapa además cada clave y cada dirección
# de destinatario en sus líneas de log. Aun así, no subas artefactos con la
# vista previa del mail ni el detalle de errores.
name: Corrida diaria

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "dry-run no escribe ni manda nada; real hace la corrida completa"
        type: choice
        options: [dry-run, real]
        default: dry-run
  # schedule:
  #   - cron: "0 20 * * 1-5"   # 17:00 en Argentina (UTC-3), de lunes a viernes

permissions:
  contents: write  # para el commit y push de Previews/

concurrency:
  group: corrida-diaria
  cancel-in-progress: false

jobs:
  corrida:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: America/Argentina/Buenos_Aires
      EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
      EMAIL_RECEIVER_CSV: ${{ secrets.EMAIL_RECEIVER_CSV }}
      GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      FED_API_KEY: ${{ secrets.FED_API_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      # El CSV de respaldo no existe en el runner: solo se lee si Supabase no responde
      RUTA_BBDD: data/no-existe.csv
      RUTA_REPO: .
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Dependencias
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Identidad de git para el commit de Previews/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Corrida
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.modo }}" = "real" ]; then
            python pipeline.py --origen github-actions
          else
            python pipeline.py --dry-run --origen github-actions
          fi
