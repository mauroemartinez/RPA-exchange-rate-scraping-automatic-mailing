# Verificaciones sin efectos externos: lint, imports y tests.
#
# No necesita ningún secreto: los tests cargan credenciales falsas, fallan si
# intentan salir a la red o abrir una conexión SMTP, y no levantan navegadores.
name: CI

on:
  push:
    branches: [main]
    # Los commits automáticos de Previews/ no tocan código
    paths-ignore: ["Previews/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Valores falsos, solo para que reporte/config.py se pueda importar
    env:
      EMAIL_SENDER: remitente@example.com
      EMAIL_PASSWORD: no-es-una-clave
      EMAIL_RECEIVER: uno@example.com
      EMAIL_RECEIVER_CSV: csv@example.com
      GEMINI_API_KEY_1: no-es-una-clave
      FED_API_KEY: no-es-una-clave
      SUPABASE_DB_URL: postgresql://usuario:clave@127.0.0.1:1/inexistente
      RUTA_BBDD: data/no-existe.csv
      RUTA_REPO: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            dashboard/requirements.txt

      - name: Dependencias
        run: pip install -r requirements-dev.txt -r dashboard/requirements.txt

      - name: Lint (ruff, incluye el orden de los imports)
        run: ruff check .

      - name: Imports
        run: >
          python -c "import pipeline; from reporte import data_access, transformations, charts,
          email_report, preview_git, ia_generator, mailer, models, fechas, indicadores, presentacion;
          from reporte.scrapers import agregados, btc, feriados, finanzas"

      - name: Tests
        run: pytest -q

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "22"

      - name: Tests del Worker de Cloudflare
        run: node --test
        working-directory: cloudflare
