# Control diario (fase 6 del roadmap): falla si un día hábil no quedó la fila de
# hoy en Supabase. Cubre la corrida que nunca arrancó, que las alertas del
# pipeline no pueden ver. Cuando falla, GitHub le avisa por mail al dueño del
# repo: un canal que no depende de la contraseña de Gmail del reporte.
#
# Desde el 14/10/2026 lo pide el Worker de Cloudflare de cloudflare/ a las 19:43
# de Argentina, con la alerta prendida (alertar=true), después del último de los
# tres intentos de la corrida (16:00, 17:07 y 19:12): si a esa hora la fila del
# día no está, ninguno salió. El horario de abajo corre SIEMPRE, sin depender de
# CORRIDA_AUTOMATICA: cubre al Worker caído o su token vencido, cuando ninguna orden
# entra, ni la del control. No cubre todo: el 05/11/2026 un cambio de permisos de
# Actions por API dejó este workflow y la corrida en disabled_manually, y el 06/11
# quedó sin reporte y sin aviso (se vio por GitHub: `gh workflow list --all`, y se
# arregló con `gh workflow enable`). GitHub ejecuta este
# horario con horas de atraso, a veces pasada la medianoche: por eso lleva --desde
# 14:00, para no controlar un día que todavía no empezó. A mano se puede correr
# siempre y, si no se pide lo contrario, sin mandar el mail de alerta.
name: Control diario

on:
  workflow_dispatch:
    inputs:
      alertar:
        description: "Mandar también el mail de alerta si falta la fila"
        type: boolean
        default: false
  schedule:
    - cron: "43 22 * * 1-5"   # 19:43 en Argentina (UTC-3), de lunes a viernes

permissions:
  contents: read

jobs:
  control:
    runs-on: ubuntu-24.04  # fija: un cambio de versión de Ubuntu puede romper las dependencias de Chromium
    timeout-minutes: 10
    env:
      EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
      # Opcional: la cuenta de Gmail cuando el remitente es un alias suyo; sin el secreto llega vacía
      EMAIL_LOGIN: ${{ secrets.EMAIL_LOGIN }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
      EMAIL_RECEIVER_CSV: ${{ secrets.EMAIL_RECEIVER_CSV }}
      # Opcional: sin el secreto llega vacía y las alertas van a EMAIL_RECEIVER_CSV
      EMAIL_ALERTAS: ${{ secrets.EMAIL_ALERTAS }}
      GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
      FED_API_KEY: ${{ secrets.FED_API_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      RUTA_BBDD: data/no-existe.csv
      RUTA_REPO: .
    steps:
      - name: Tapar en el log cada dirección de mail
        # GitHub tapa los secretos enteros, pero una dirección suelta de una lista no
        run: |
          for m in $(printf '%s' "$EMAIL_RECEIVER,$EMAIL_RECEIVER_CSV,$EMAIL_ALERTAS" | tr ',' ' '); do echo "::add-mask::$m"; done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Dependencias
        run: pip install -r requirements.txt

      - name: Control
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python scripts/control_diario.py --desde 14:00
          elif [ "${{ inputs.alertar }}" = "true" ]; then
            python scripts/control_diario.py
          else
            python scripts/control_diario.py --sin-alerta
          fi
