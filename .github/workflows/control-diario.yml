# Control diario (fase 6 del roadmap): falla si un día hábil no quedó la fila de
# hoy en Supabase. Cubre la corrida que nunca arrancó, que las alertas del
# pipeline no pueden ver. Cuando falla, GitHub le avisa por mail al dueño del
# repo: un canal que no depende de la contraseña de Gmail del reporte.
#
# Se prende con el mismo interruptor que la corrida: la variable del repo
# CORRIDA_AUTOMATICA en si. A mano se puede correr siempre y, si no se pide lo
# contrario, sin mandar el mail de alerta. Corre a las 17:00 de Argentina (20:00
# UTC), una hora después de la corrida de las 16:00: antes, la fila todavía no
# existe. Si GitHub atrasa mucho la corrida, este control puede avisar de más:
# conviene mirar Actions antes de correr nada a mano.
name: Control diario

on:
  workflow_dispatch:
    inputs:
      alertar:
        description: "Mandar también el mail de alerta si falta la fila"
        type: boolean
        default: false
  schedule:
    - cron: "0 20 * * 1-5"    # 17:00 en Argentina (UTC-3), de lunes a viernes

permissions:
  contents: read

jobs:
  control:
    # GitHub compara sin distinguir mayúsculas: vale si, Si o SI, y también sí con tilde
    if: github.event_name != 'schedule' || vars.CORRIDA_AUTOMATICA == 'si' || vars.CORRIDA_AUTOMATICA == 'sí'
    runs-on: ubuntu-24.04  # fija: un cambio de versión de Ubuntu puede romper las dependencias de Chromium
    timeout-minutes: 10
    env:
      EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
      EMAIL_RECEIVER_CSV: ${{ secrets.EMAIL_RECEIVER_CSV }}
      # Opcional: sin el secreto llega vacía y las alertas van a EMAIL_RECEIVER_CSV
      EMAIL_ALERTAS: ${{ secrets.EMAIL_ALERTAS }}
      GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
      FED_API_KEY: ${{ secrets.FED_API_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      RUTA_BBDD: data/no-existe.csv
      RUTA_REPO: .
    steps:
      - name: Tapar en el log cada dirección de mail
        # GitHub tapa los secretos enteros, pero una dirección suelta de una lista no
        run: |
          for m in $(printf '%s' "$EMAIL_RECEIVER,$EMAIL_RECEIVER_CSV,$EMAIL_ALERTAS" | tr ',' ' '); do echo "::add-mask::$m"; done

      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Dependencias
        run: pip install -r requirements.txt

      - name: Control
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.alertar }}" = "true" ]; then
            python scripts/control_diario.py
          else
            python scripts/control_diario.py --sin-alerta
          fi
